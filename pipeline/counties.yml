sf:
  name: San Francisco
  csv_code: SF
  geometry:
    type: socrata
    domain: data.sfgov.org
    dataset: acdm-wktn
    join_field: blklot
    footprint_field: mapblklot
    address_fields: [from_address_num, street_name, street_type]
    neighborhood_field: analysis_neighborhood
    where: "active = true"
    select:
      - shape
      - blklot
      - mapblklot
      - block_num
      - lot_num
      - from_address_num
      - street_name
      - street_type
      - analysis_neighborhood
  apn_normalizer: sf
  description_source: sf_roll
  vintage_tax: "2020–21 roll"
  tax_record_url: "https://sanfrancisco-ca.county-taxes.com/public/search?search_query={apn}&category=gsgx_property_tax"
  city: "San Francisco, CA"
  center: [-122.4415, 37.762]
  zoom: 12.2
  minzoom: 10

berkeley:
  name: Berkeley
  csv_code: AL
  subset: true  # geometry covers one city; most county tax rows won't match
  address_strip_regex: '\s+BERKELEY\s+\d{5}$'  # CSV addresses end with "BERKELEY 94704"
  # Current-year ad-valorem tax computed from the county's assessed-value roll
  # joined to per-TRA rates. Excludes parcel taxes / special assessments.
  tax_source:
    type: alameda_roll
    roll_url: "https://services5.arcgis.com/ROBnTHSNjoZ2Wm1P/ArcGIS/rest/services/Assessor_Office_Secured_Tax_Roll_2025_to_2026/FeatureServer/0"
    rates_url: "https://services5.arcgis.com/ROBnTHSNjoZ2Wm1P/ArcGIS/rest/services/Property_Tax_Rates_2025/FeatureServer/0"
    use_codes_url: "https://services5.arcgis.com/ROBnTHSNjoZ2Wm1P/ArcGIS/rest/services/Assessor_Office_Use_Codes/FeatureServer/0"
    where: "Situs_City = 'BERKELEY'"
  description_source: alameda_use_codes
  vintage_tax: "2025–26 ad valorem"
  tax_note: "Ad-valorem tax for 2025–26; excludes parcel taxes and special assessments"
  geometry:
    type: arcgis
    url: "https://services5.arcgis.com/ROBnTHSNjoZ2Wm1P/ArcGIS/rest/services/Parcels/FeatureServer/0"
    join_field: APN
    footprint_strategy: geometry  # condo lots are stacked identical polygons
    address_fields: [SitusStreetNumber, SitusStreetName]
    neighborhood_field: SitusZip
    where: "SitusCity = 'BERKELEY'"
    select: [APN, SitusStreetNumber, SitusStreetName, SitusCity, SitusZip]
  # Berkeley has no open neighborhoods layer; ZIPs map onto its named areas.
  neighborhood_map:
    "94702": West Berkeley
    "94703": South Berkeley
    "94704": Downtown / Southside
    "94705": Elmwood / Claremont
    "94706": Westbrae
    "94707": Thousand Oaks
    "94708": Berkeley Hills
    "94709": North Berkeley
    "94710": West Berkeley (waterfront)
    "94720": UC Campus
  apn_normalizer: alameda
  # The county tax portal has no per-APN deep link; popup shows the APN to paste.
  tax_record_url: "https://propertytax.alamedacountyca.gov/search"
  city: "Berkeley, CA"
  center: [-122.272, 37.867]
  zoom: 13
  minzoom: 10
